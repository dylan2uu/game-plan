<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Plan</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="/icon.svg" alt="" width="26" height="26"><span>Game Plan</span></div>
  <div class="today" id="today"></div>
  <div class="prog" id="prog" aria-live="polite"></div>
</header>

<main>
  <section class="hero" id="hero" aria-label="Start here"></section>

  <div class="cols">
    <section class="card" aria-labelledby="up-h">
      <h2 id="up-h">Up next</h2>
      <div id="lists"></div>
    </section>
    <section class="card" aria-labelledby="cal-h">
      <div class="cal-head">
        <button class="icon-btn" data-act="prev" aria-label="Previous month">‹</button>
        <h2 id="cal-h"></h2>
        <button class="icon-btn" data-act="next" aria-label="Next month">›</button>
      </div>
      <div class="cal" id="cal"></div>
      <div class="day-list" id="dayList"></div>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status" hidden></div>
<script src="/app.js"></script>
</body>
</html>
